
services:
  db:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: solverAppDB
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  backend:
    build: ./server/allTheMethods
    ports:
      - 8080:8080
    environment:
      DB_URL: jdbc:postgresql://db:5432/solverAppDB
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
    
  
  frontend:
    build: ./clientside
    ports:
      - 5173:80
    depends_on:
      - backend

volumes:
  pgdata:

