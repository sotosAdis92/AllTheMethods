version: '3.8'

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: spring-react-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spring-react-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./server/allTheMethods
      dockerfile: Dockerfile
    container_name: spring-react-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    networks:
      - spring-react-network
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./clientside
      dockerfile: Dockerfile
    container_name: spring-react-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8080
    networks:
      - spring-react-network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    name: spring-react-postgres-data

networks:
  spring-react-network:
    name: spring-react-network
    driver: bridge
