version: "3.8"
services:
  db:
    image: postgres:16.0
    container_name: postgres_cont
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: solverAppDB
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  backend:
    build: ./server/allTheMethods
    ports:
      - 8080:8080
    environment:
      DB_URL: jdbc:postgresql://db:5432/solverAppDB
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    
  
  frontend:
    build: ./clientside
    ports:
      - 5173:80

volumes:
  allTheMethods:

